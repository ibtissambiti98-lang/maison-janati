<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAISON JENNATI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --royal-blue: #1b3022; --cream: #f9f7f2; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--cream); }
        .lang-bar { background: #333; padding: 8px; text-align: center; }
        .lang-bar button { background: none; border: 1px solid white; color: white; padding: 3px 10px; cursor: pointer; }
        header { padding: 25px; background: white; text-align: center; border-bottom: 2px solid var(--gold); }
        .hero { height: 60vh; overflow: hidden; }
        .hero video { width: 100%; height: 100%; object-fit: cover; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; }
        .card { background: white; padding: 10px; border-radius: 8px; }
        .card img { width: 100%; height: 450px; object-fit: cover; }
        .btn { display: block; background: var(--royal-blue); color: var(--gold); padding: 12px; margin-top: 10px; text-align: center; text-decoration: none; border: 1px solid var(--gold); }
        /* لوحة التحكم السرية */
        #admin-panel { display: none; background: #fff3cd; padding: 20px; border: 2px dashed #856404; margin: 20px; }
    </style>
</head>
<body>

    <div class="lang-bar">
        <button onclick="setLang('ar')">العربية</button>
        <button onclick="setLang('fr')">Français</button>
        <button onclick="setLang('en')">English</button>
        <button onclick="toggleAdmin()" style="margin-right:20px; border-color:red;">⚙️</button>
    </div>

    <header><h1 id="title">MAISON JENNATI</h1></header>

    <section class="hero"><video autoplay muted loop playsinline><source src="janati-bg.mp4" type="video/mp4"></video></section>

    <!-- لوحة التحكم السرية (تظهر فقط بالضغط على زر الإعدادات) -->
    <section id="admin-panel">
        <h3>لوحة تحكم المدير</h3>
        <p>إضافة صورة (رابط الصورة):</p>
        <input type="text" id="newImg" placeholder="caftan22.jpg">
        <button onclick="addImage()">إضافة صورة</button>
    </section>

    <section class="grid" id="gallery"></section>

    <script>
        const translations = {
            ar: { title: "ميزون جناتي", btn: "استفسر عبر الواتساب" },
            fr: { title: "MAISON JENNATI", btn: "Contactez via WhatsApp" },
            en: { title: "MAISON JENNATI", btn: "Inquire via WhatsApp" }
        };

        function setLang(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('title').innerText = translations[lang].title;
            document.querySelectorAll('.btn').forEach(b => b.innerText = translations[lang].btn);
        }

        function toggleAdmin() {
            let panel = document.getElementById('admin-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function addImage() {
            let img = document.getElementById('newImg').value;
            let gallery = document.getElementById('gallery');
            gallery.innerHTML += <div class="card"><img src="${img}"><a href="#" class="btn">استفسر</a></div>;
        }

        // تحميل الصور الافتراضية
        const gallery = document.getElementById('gallery');
        for (let i = 1; i <= 21; i++) {
            gallery.innerHTML += `
                <div class="card" id="c${i}">
                    <img src="caftan${i}.jpg" onerror="document.getElementById('c${i}').remove()">
                    <a href="https://wa.me/212664979332" class="btn">استفسر عبر الواتساب</a>
                </div>
            `;
        }
    </script>
</body>
</html>
