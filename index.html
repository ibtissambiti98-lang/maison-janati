<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Janati | Haute Couture Marocaine</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0a0a0e; --bg-card: #131219; --gold: #d4af37; --gold-light: #f3e5ab; --text-light: #f0eee6; --text-muted: #a6a095; --border-gold: rgba(212, 175, 55, 0.25); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Amiri', serif; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(10,10,14,0.95); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-gold); backdrop-filter: blur(10px); }
        .logo { color: var(--gold); font-size: 1.3rem; font-weight: bold; text-transform: uppercase; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-light); cursor: pointer; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .page { display: none; padding: 120px 8% 50px 8%; }
        .page.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-gold); padding: 15px; border-radius: 8px; }
        .card img { width: 100%; height: 350px; object-fit: cover; border-radius: 4px; }
        .btn-gold { background: var(--gold); color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Maison Janati</div>
        <ul class="nav-links">
            <li><a onclick="switchPage('home')" id="link-home" class="active">الرئيسية</a></li>
            <li><a onclick="switchPage('catalog')" id="link-catalog">التشكيلة</a></li>
            <li><a onclick="switchPage('about')" id="link-about">عن الدار</a></li>
        </ul>
    </nav>

    <!-- الصفحة الرئيسية -->
    <div id="page-home" class="page active">
        <h1>فخامة القفطان المغربي</h1>
        <p>مرحباً بكم في دار جناتي للأزياء الراقية.</p>
    </div>

    <!-- صفحة التشكيلة -->
    <div id="page-catalog" class="page">
        <div class="grid" id="catalog-grid"></div>
    </div>

    <!-- صفحة عن الدار -->
    <div id="page-about" class="page">
        <img src="bouchra_photo.jpg" alt="بشرى جناتي" style="width:200px; height:200px; border-radius:50%; border:3px solid #d4af37;">
        <h2>بشرى جناتي</h2>
        <p>إرث من الفخامة والشغف بالقفطان المغربي.</p>
    </div>

    <script>
        const itemsData = [];
        for(let i = 1; i <= 13; i++) {
            itemsData.push({ img: caftan${i}.jpg, title: القفطان رقم ${i} });
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = itemsData.map(item => `
                <div class="card">
                    <img src="${item.img}?v=${Date.now()}" alt="${item.title}">
                    <h3>${item.title}</h3>
                </div>
            `).join('');
        }

        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.getElementById('link-' + id).classList.add('active');
        }

        renderCatalog();
    </script>
</body>
</html>
