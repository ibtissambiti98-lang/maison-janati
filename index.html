<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزون جناتي | Maison Jennati للقفطان المغربي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --royal-blue: #1b3022;
            --cream: #f9f7f2;
            --text: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--cream); color: var(--text); }
        
        header { background: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; padding-left: 5%; padding-right: 5%; border-bottom: 3px solid var(--gold); }
        .logo { font-family: 'Amiri', serif; font-size: 28px; color: var(--royal-blue); font-weight: bold; letter-spacing: 2px; }
        
        /* قسم الفيديو المُحسّن لضمان ظهوره */
        .hero { width: 100%; height: 75vh; position: relative; overflow: hidden; border-bottom: 5px solid var(--gold); background: #000; }
        .hero video { width: 100%; height: 100%; object-fit: cover; }
        
        .designer-section { background: #fff; padding: 50px 8%; display: flex; flex-wrap: wrap; align-items: center; gap: 30px; border-bottom: 1px solid #e0dcd0; }
        .designer-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        .designer-text { flex: 1; min-width: 280px; text-align: justify; }
        .designer-text h2 { font-family: 'Amiri', serif; font-size: 26px; color: var(--royal-blue); margin-bottom: 10px; }
        .designer-text p { font-size: 15px; line-height: 1.8; color: #555; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; }
        .card { background: white; padding: 10px; border-radius: 8px; border: 1px solid #e0dcd0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 420px; object-fit: cover; border-radius: 5px; border: 1px solid var(--gold); }
        
        .btn { display: block; background: var(--royal-blue); color: var(--gold); padding: 12px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 4px; border: 1px solid var(--gold); transition: 0.3s; }
        .btn:hover { background: var(--gold); color: white; }
        
        .float-wa { position: fixed; bottom: 30px; left: 30px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        footer { background: var(--royal-blue); color: white; text-align: center; padding: 20px; font-family: 'Amiri', serif; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MAISON JENNATI</div>
        <select id="lang" onchange="updateLang()" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--gold); cursor: pointer;">
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
    </header>

    <!-- قسم الفيديو المعدل ليعمل بكفاءة -->
    <section class="hero">
        <video autoplay muted loop playsinline preload="auto">
            <source src="janati-bg.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </section>

    <!-- قسم المصممة -->
    <section class="designer-section">
        <img src="bouchra_photo.jpg" alt="المصممة وصاحبة الدار" class="designer-img" onerror="this.style.display='none'">
        <div class="designer-text">
            <h2 id="designer-title">لمسة ميزون جناتي الفنية</h2>
            <p id="designer-desc">تسهر مصممة الدار وصاحبة المحل بنفسها على إخراج هذه التحف الفنية، متعاونة جنباً إلى جنب مع كبار المعلمين التقليديين. كل قفطان هنا يروي حكاية عراقة التراث المغربي بأجود الأثواب وأدق تفاصيل التطريز اليدوي.</p>
        </div>
    </section>

    <!-- معرض القفاطن -->
    <section class="grid" id="gallery"></section>

    <a href="https://wa.me/212664979332?text=أهلاً ميزون جناتي، أريد الاستفسار عن تصاميمكم الفاخرة" class="float-wa" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p id="footer-text">ميزون جناتي للقفطان المغربي الأصيل © 2026</p>
    </footer>

    <script>
        const descriptions = [
            "قفطان فاخر من ثوب البروكار الملكي، مشدود بخدمة المعلم التقليدية وتطريز الصم الحر.",
            "تحفة فنية من الحرير الخالص، مرصعة بالكامل بالعقيق الحر ومزينة بطرز الرباطي المتفرد.",
            "إبداع يجمع بين فخامة المخمل ولسمات السفيفة المتقونة بأدق تفاصيل التراث المغربي الأصيل.",
            "قفطان بتصميم ساحر، مصنوع من أجود الأثواب المختارة بعناية مع تطريز يدوي خالص.",
            "خلاصة الأصالة المغربية؛ ثوب منسوج بحرفية عالية وعقيق حر يلمع برقة وفخامة."
        ];

        const content = {
            ar: {
                title: "لمسة ميزون جناتي الفنية",
                desc: "تسهر مصممة الدار وصاحبة المحل بنفسها على إخراج هذه التحف الفنية، متعاونة جنباً إلى جنب مع كبار المعلمين التقليديين. كل قفطان هنا يروي حكاية عراقة التراث المغربي بأجود الأثواب وأدق تفاصيل التطريز اليدوي.",
                btn: "استفسر عبر الواتساب",
                footer: "ميزون جناتي للقفطان المغربي الأصيل © 2026"
            },
            fr: {
                title: "L'Art et la Passion chez Maison Jennati",
                desc: "La créatrice veille personnellement à la confection de ces chefs-d'œuvre en collaboration avec les maîtres artisans traditionnels pour offrir l'excellence de l'artisanat marocain.",
                btn: "Commander sur WhatsApp",
                footer: "Maison Jennati - Caftan Marocain Authentique © 2026"
            },
            en: {
                title: "Artistry & Passion at Maison Jennati",
                desc: "The house designer personally oversees the creation of these masterpieces, working hand-in-hand with master traditional craftsmen to ensure the finest Moroccan heritage.",
                btn: "Inquire via WhatsApp",
                footer: "Maison Jennati Authentic Moroccan Caftan © 2026"
            }
        };

        function updateLang() {
            const lang = document.getElementById('lang').value;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            
            document.getElementById('designer-title').innerText = content[lang].title;
            document.getElementById('designer-desc').innerText = content[lang].desc;
            document.getElementById('footer-text').innerText = content[lang].footer;
            
            document.querySelectorAll('.btn-text').forEach(b => b.innerText = content[lang].btn);
        }

        const gallery = document.getElementById('gallery');
        for (let i = 1; i <= 22; i++) {
            let desc = descriptions[(i - 1) % descriptions.length];
            gallery.innerHTML += `
                <div class="card">
                    <img src="caftan${i}.jpg" alt="قفطان مغربي">
                    <div style="padding:15px; text-align:center;">
                        <p style="font-size:14px; color:#555; margin-bottom:15px; line-height:1.6;">${desc}</p>
                        <a href="https://wa.me/212664979332?text=أهلاً ميزون جناتي، أنا مهتم بهذا القفطان وأود معرفة التفاصيل" class="btn" target="_blank">
                            <span class="btn-text">استفسر عبر الواتساب</span>
                        </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
