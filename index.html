<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Maison Janati | Zinith</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #000; color: #fff; overflow: hidden; }
        
        /* الهيدر */
        nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; padding: 20px 50px; z-index: 1000; background: rgba(0,0,0,0.6); }
        .nav-links a { margin: 0 15px; cursor: pointer; color: #d4af37; text-decoration: none; font-weight: bold; }
        .lang-switch button { cursor: pointer; padding: 5px 12px; margin: 0 5px; background: #d4af37; border: none; border-radius: 4px; color: #000; font-weight: bold; }
        
        /* الفيديو والتحكم فيه بالاسم الصحيح janati-bg.mp4 */
        #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #video-control { position: fixed; bottom: 20px; left: 20px; z-index: 1000; padding: 10px; background: rgba(0,0,0,0.7); color: #d4af37; border: 1px solid #d4af37; cursor: pointer; border-radius: 5px; }

        /* الصفحات */
        .page { display: none; height: 100vh; padding-top: 150px; text-align: center; }
        .page.active { display: block; background: rgba(0,0,0,0.4); }
        
        .materials-box { margin-top: 30px; background: rgba(0,0,0,0.7); padding: 20px; border: 1px solid #d4af37; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- استخدام الاسم الصحيح الدقيق للملف من الصورة -->
    <video id="video-bg" autoplay muted loop>
        <source src="janati-bg.mp4" type="video/mp4">
    </video>

    <!-- زر التحكم في الفيديو -->
    <button id="video-control">إيقاف الفيديو</button>

    <nav>
        <div class="logo">Maison Janati</div>
        <div class="nav-links">
            <a id="btn-home">الرئيسية</a>
            <a id="btn-catalog">التشكيلة</a>
            <a id="btn-about">عن الدار</a>
        </div>
        <div class="lang-switch">
            <button id="lang-ar">AR</button>
            <button id="lang-fr">FR</button>
            <button id="lang-en">EN</button>
        </div>
    </nav>

    <div id="page-home" class="page active">
        <h1 id="h1-title">مرحباً في Maison Janati</h1>
    </div>

    <div id="page-catalog" class="page">
        <h1 id="h1-cat">التشكيلة</h1>
    </div>

    <div id="page-about" class="page">
        <h1 id="h1-about">عن الدار</h1>
        <div class="materials-box">
            <h2 id="h2-mat">المواد الأولية</h2>
            <ul id="ul-mat"></ul>
        </div>
    </div>

    <script>
        const content = {
            ar: { home: "الرئيسية", cat: "التشكيلة", about: "عن الدار", h1: "مرحباً في Maison Janati", h1c: "التشكيلة", h1a: "عن الدار", mat: "المواد الأولية", list: ["حرير طبيعي", "خيوط الصقلي", "أحجار كريمة"], vBtn: "إيقاف الفيديو" },
            fr: { home: "Accueil", cat: "Collection", about: "La Maison", h1: "Bienvenue à Maison Janati", h1c: "Collection", h1a: "La Maison", mat: "Matières Premières", list: ["Soie naturelle", "Fils Skalli", "Pierres précieuses"], vBtn: "Arrêter la vidéo" },
            en: { home: "Home", cat: "Collection", about: "The House", h1: "Welcome to Maison Janati", h1c: "Collection", h1a: "The House", mat: "Raw Materials", list: ["Natural Silk", "Skalli Threads", "Gemstones"], vBtn: "Stop video" }
        };

        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        function setLang(lang) {
            const t = content[lang];
            document.getElementById('btn-home').innerText = t.home;
            document.getElementById('btn-catalog').innerText = t.cat;
            document.getElementById('btn-about').innerText = t.about;
            document.getElementById('h1-title').innerText = t.h1;
            document.getElementById('h1-cat').innerText = t.h1c;
            document.getElementById('h1-about').innerText = t.h1a;
            document.getElementById('h2-mat').innerText = t.mat;
            document.getElementById('video-control').innerText = t.vBtn;
            document.getElementById('ul-mat').innerHTML = t.list.map(i => <li>${i}</li>).join('');
            document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
        }

        const video = document.getElementById('video-bg');
        const vBtn = document.getElementById('video-control');
        vBtn.onclick = () => {
            if (video.paused) { video.play(); vBtn.innerText = content[document.documentElement.dir === 'rtl' ? (document.documentElement.lang || 'ar') : 'ar'].vBtn === "إيقاف الفيديو" ? "إيقاف الفيديو" : "Stop video"; }
            else { video.pause(); vBtn.innerText = "تشغيل الفيديو"; }
        };

        document.getElementById('btn-home').onclick = () => switchPage('home');
        document.getElementById('btn-catalog').onclick = () => switchPage('catalog');
        document.getElementById('btn-about').onclick = () => switchPage('about');
        
        document.getElementById('lang-ar').onclick = () => setLang('ar');
        document.getElementById('lang-fr').onclick = () => setLang('fr');
        document.getElementById('lang-en').onclick = () => setLang('en');

        setLang('ar');
    </script>
</body>
</html>
