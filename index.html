<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ميزون جناتي | Maison Jennati</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;       /* ذهبي ملكي */
            --royal-blue: #1b3022; /* أخضر غامق ملكي أو أزرق تراثي */
            --cream: #f9f7f2;      /* خلفية كريمية */
            --text: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--cream); color: var(--text); font-family: 'Amiri', serif; }
        
        /* ترويسة الموقع */
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 3px solid var(--gold); }
        .logo { font-size: 32px; color: var(--royal-blue); letter-spacing: 2px; }
        
        /* القسم الترحيبي */
        .hero { height: 70vh; position: relative; border-bottom: 5px solid var(--gold); }
        .hero video { width: 100%; height: 100%; object-fit: cover; }
        
        /* الشبكة والبطاقات */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; padding: 60px 10%; }
        .card { background: white; padding: 10px; border: 1px solid #ddd; transition: 0.4s; }
        .card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 450px; object-fit: cover; border: 1px solid var(--gold); }
        
        /* الأزرار */
        .btn { display: block; background: var(--royal-blue); color: var(--gold); padding: 15px; text-align: center; text-decoration: none; font-weight: bold; text-transform: uppercase; border: 1px solid var(--gold); }
        .btn:hover { background: var(--gold); color: white; }
        
        /* زر واتساب العائم */
        .float-wa { position: fixed; bottom: 30px; left: 30px; background: var(--gold); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header>
        <div class="logo">MAISON JENNATI</div>
        <select id="lang" onchange="updateLang()" style="margin-top:10px;">
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline><source src="Janati-bg.mp4" type="video/mp4"></video>
    </section>

    <section class="grid" id="gallery"></section>

    <a href="https://wa.me/212664979332" class="float-wa" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        const content = {
            ar: { desc: "قفطان ميزون جناتي: مزيج بين الأصالة واللمسة الفنية المعاصرة.", btn: "احصل عليه الآن" },
            fr: { desc: "Caftan Maison Jennati: L'alliance de l'authenticité et du raffinement moderne.", btn: "Commander maintenant" },
            en: { desc: "Maison Jennati Caftan: A fusion of tradition and contemporary artistry.", btn: "Order now" }
        };

        function updateLang() {
            const lang = document.getElementById('lang').value;
            document.querySelectorAll('.prod-desc').forEach(d => d.innerText = content[lang].desc);
            document.querySelectorAll('.btn-text').forEach(b => b.innerText = content[lang].btn);
        }

        const gallery = document.getElementById('gallery');
        for (let i = 1; i <= 22; i++) {
            gallery.innerHTML += `
                <div class="card">
                    <img src="Caftan${i}.jpg" onerror="this.src='caftan${i}.jpg'">
                    <div style="padding:20px; text-align:center;">
                        <h3 style="color:var(--royal-blue); margin-bottom:10px;">Collection N°${i}</h3>
                        <p class="prod-desc" style="margin-bottom:15px; font-size:14px;">${content.ar.desc}</p>
                        <a href="https://wa.me/212664979332?text=أريد الاستفسار عن القفطان رقم ${i}" class="btn">
                            <span class="btn-text">${content.ar.btn}</span>
                        </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
