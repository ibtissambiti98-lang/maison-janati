
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Maison Janati | Zinith</title>
    <style>
        body { margin: 0; background: #0a0a0e; color: #f0eee6; font-family: 'Arial', sans-serif; }
        nav { display: flex; justify-content: space-between; padding: 20px; background: #16161c; border-bottom: 2px solid #d4af37; }
        .nav-links a, .lang-switch button { cursor: pointer; color: #d4af37; padding: 10px; border: 1px solid #d4af37; margin: 0 5px; background: none; border-radius: 5px; }
        .nav-links a.active, .lang-switch button.active { background: #d4af37; color: #000; }
        .page { display: none; padding: 40px; }
        .page.active { display: block; }
        .materials-section { border: 1px solid #d4af37; padding: 20px; margin-top: 20px; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #131219; padding: 15px; border: 1px solid #333; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Maison Janati</div>
    <div class="nav-links">
        <a id="btn-home" class="active">الرئيسية</a>
        <a id="btn-catalog">التشكيلة</a>
        <a id="btn-about">عن الدار</a>
    </div>
    <div class="lang-switch">
        <button id="lang-ar" class="active">AR</button>
        <button id="lang-fr">FR</button>
        <button id="lang-en">EN</button>
    </div>
</nav>

<div id="page-home" class="page active">
    <h1>مرحباً بكم في Maison Janati</h1>
    <p>إبداع يجمع بين الأصالة والحداثة (Zinith).</p>
</div>

<div id="page-catalog" class="page">
    <h1>التشكيلة</h1>
    <div class="grid" id="catalog-content"></div>
</div>

<div id="page-about" class="page">
    <h1>عن الدار</h1>
    <p>بشرى جناتي، رحلة من الشغف في عالم القفطان.</p>
    <div class="materials-section">
        <h2 id="mat-title">المواد الأولية</h2>
        <ul id="mat-list"></ul>
    </div>
</div>

<script>
    const content = {
        ar: { home: "الرئيسية", cat: "التشكيلة", about: "عن الدار", mat: "المواد الأولية", list: ["حرير طبيعي", "خيوط الصقلي", "أحجار كريمة", "طرز فاسي"] },
        fr: { home: "Accueil", cat: "Collection", about: "La Maison", mat: "Matières Premières", list: ["Soie naturelle", "Fils Skalli", "Pierres précieuses", "Broderie Fassi"] },
        en: { home: "Home", cat: "Collection", about: "The House", mat: "Raw Materials", list: ["Natural Silk", "Skalli Threads", "Gemstones", "Fassi Embroidery"] }
    };

    function switchPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('btn-' + id).classList.add('active');
    }

    function setLang(lang) {
        const t = content[lang];
        document.getElementById('btn-home').innerText = t.home;
        document.getElementById('btn-catalog').innerText = t.cat;
        document.getElementById('btn-about').innerText = t.about;
        document.getElementById('mat-title').innerText = t.mat;
        const list = document.getElementById('mat-list');
        list.innerHTML = t.list.map(i => <li>${i}</li>).join('');
        document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
    }

    // الربط المباشر (الموثوق)
    document.getElementById('btn-home').addEventListener('click', () => switchPage('home'));
    document.getElementById('btn-catalog').addEventListener('click', () => switchPage('catalog'));
    document.getElementById('btn-about').addEventListener('click', () => switchPage('about'));

    document.getElementById('lang-ar').addEventListener('click', () => setLang('ar'));
    document.getElementById('lang-fr').addEventListener('click', () => setLang('fr'));
    document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

    // تهيئة الصفحة
    setLang('ar');
</script>
</body>
</html>
